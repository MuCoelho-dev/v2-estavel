<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitalis - Histórico de Saúde</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <!-- Barra do topo: só aparece no celular (ver "Celular" no fim do style.css) -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">V</div>
        <div>
          <strong>VITALIS</strong>
          <small>Histórico de Saúde</small>
        </div>
      </div>
      <button class="menu-toggle" type="button" aria-label="Abrir menu" onclick="document.body.classList.toggle('menu-aberto')">☰ Menu</button>
    </header>
    <div class="menu-fundo" onclick="document.body.classList.remove('menu-aberto')"></div>

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">V</div>
        <div>
          <strong>VITALIS</strong>
          <small>Histórico de Saúde</small>
        </div>
      </div>
      <ul class="menu" id="menu"></ul>
      <div class="logout" onclick="Vitalis.sair()">🚪 &nbsp;Sair da conta</div>
    </aside>

    <main class="main" id="conteudo"></main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/modulos.js"></script>
  <script src="js/dependentes.js"></script>
  <script src="js/leitor-ocr.js"></script>
  <script src="js/reconhecedor.js"></script>
  <script src="js/leitor-ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Celular: fecha o menu recolhível ao escolher uma tela ou trocar o perfil
    function fecharMenu() { document.body.classList.remove('menu-aberto'); }
    window.addEventListener('hashchange', fecharMenu);
    document.getElementById('menu').addEventListener('click', e => { if (e.target.closest('a')) fecharMenu(); });
    document.querySelector('.sidebar').addEventListener('change', fecharMenu);
  </script>
</body>
</html>
